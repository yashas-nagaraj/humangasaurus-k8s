apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        # ⚠️ Make sure this matches your DockerHub repo
        image: yashasnagaraj/humangasaurus-backend
        ports:
        - containerPort: 5000
        env:
          - name: DB_HOST
            valueFrom: { secretKeyRef: { name: humangasaurus-secrets, key: db-host } }
          - name: DB_USER
            valueFrom: { secretKeyRef: { name: humangasaurus-secrets, key: db-user } }
          - name: DB_PASSWORD
            valueFrom: { secretKeyRef: { name: humangasaurus-secrets, key: db-password } }
          - name: DB_NAME
            valueFrom: { secretKeyRef: { name: humangasaurus-secrets, key: db-name } }
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: LoadBalancer
